<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hungry Owl — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Playfair+Display:wght@700;800&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="icon" type="image/svg+xml" href="/hungry-owl-logo.svg">
</head>
<body>

<div class="announcement-banner" id="announcementBanner" style="display:none;">
  <span class="announcement-icon">📢</span>
  <span id="announcementText"></span>
</div>

<div class="page-frame">
  <div class="page-inner">
    <div class="header">
      <div id="logoArea">
        <img src="/hungry-owl-logo.svg" alt="Hungry Owl" class="owl">
      </div>
      <div class="brand">
        <h1 id="brandName">Hungry Owl</h1>
        <p id="brandTagline">— The Cloud Café —</p>
        <a href="#" id="brandPhone" class="brand-phone" style="display:none;">📞 <span id="brandPhoneNum"></span></a>
      </div>
    </div>

    <div class="menu-layout">
      <nav class="cat-rail" id="catRail"></nav>
      <div id="menuArea">
        <div class="loading">Loading menu…</div>
      </div>
    </div>

    <div class="footer-art">
      <svg width="220" height="90" viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 70 L55 30 L100 70 Z" fill="#F3D9A6" stroke="#201A10" stroke-width="3" stroke-linejoin="round"/>
        <rect x="14" y="60" width="82" height="8" fill="#8BAA5C" stroke="#201A10" stroke-width="2"/>
        <path d="M85 30 Q120 20 120 45 L120 78 Q120 84 114 84 L92 84 Q86 84 86 78 Z" fill="#8B5A2B" stroke="#201A10" stroke-width="3"/>
        <path d="M120 45 Q136 45 132 58 Q128 68 118 62" fill="none" stroke="#201A10" stroke-width="3"/>
        <path d="M96 24 Q100 14 96 6" stroke="#B8A98A" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M108 24 Q112 14 108 6" stroke="#B8A98A" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="165" cy="66" rx="42" ry="16" fill="#fff" stroke="#201A10" stroke-width="3"/>
        <ellipse cx="150" cy="64" rx="12" ry="10" fill="#F0C24E" stroke="#201A10" stroke-width="2.5"/>
        <ellipse cx="182" cy="64" rx="12" ry="10" fill="#F0C24E" stroke="#201A10" stroke-width="2.5"/>
      </svg>
    </div>
  </div>
</div>

<div class="fab-row">
  <button class="fab fab-cart" id="cartFab" title="View your order" style="display:none;">
    <span class="cart-fab-main">🛒 <span id="cartBadge">0</span> items</span>
    <span class="cart-fab-sub">CHECKOUT →</span>
  </button>
</div>

<!-- CART / ORDER MODAL -->
<div class="modal-backdrop" id="cartBackdrop">
  <div class="modal">
    <button class="modal-close" id="cartClose">✕</button>
    <h2>Your Order</h2>
    <div id="cartItems"></div>
    <div class="order-total-row" id="cartTotalRow" style="display:none;">
      <span>Total</span><span id="cartTotal">₹0</span>
    </div>
    <div class="field" style="margin-top:16px;">
      <label>Your Name * <span style="font-weight:400; color:var(--muted);">(and table number, if you have one)</span></label>
      <input type="text" id="orderNote" placeholder="e.g. Riya, Table 4" required>
    </div>
    <canvas id="orderCanvas" style="display:none;"></canvas>
    <img id="orderCanvasPreview" style="display:none;">
    <button class="btn btn-block" id="sendOrderBtn" style="margin-top:8px;">📤 Send Order</button>
    <p class="hint" id="sendOrderHint"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared.js"></script>
<script src="/customer.js"></script>
</body>
</html>
